 /* --- DESCARGA AUTOMÁTICA DEL DOCUMENTO --- */
 document.getElementById('download-self-btn').addEventListener('click', () => {
 const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
 const blob = new Blob([htmlContent], { type: 'text/html' });
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = 'Flores_Amarillas_Espaciales.html';
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 URL.revokeObjectURL(url);
 });

 /* --- GESTIÓN DE AUDIO Y PANTALLA DE INICIO --- */
 const audio = document.getElementById('bg-music');
 const welcomeScreen = document.getElementById('welcome-screen');
 const startBtn = document.getElementById('start-btn');
 const musicControl = document.getElementById('music-control');

 function playMusic() {
 audio.play().then(() => {
 musicControl.textContent = '🎵';
 }).catch((err) => {
 console.log("El navegador bloqueó la reproducción automática:", err);
 });
 }

 startBtn.addEventListener('click', () => {
 welcomeScreen.classList.add('hidden');
 playMusic();
 finishIntro();
 });

 musicControl.addEventListener('click', () => {
 if (audio.paused) {
 audio.play();
 musicControl.textContent = '🎵';
 } else {
 audio.pause();
 musicControl.textContent = '🔇';
 }

 },

 text: 'Explotó un 21 de septiembre y desde entonces la onda expansiva sigue viajando con pura alegría y ganas de empezar de nuevo. Le desea a todo lo que encuentra un comienzo fresco y una vida entera pa compartir. La energía más chévere del sector.',
 },

 {

 const IS_MOBILE = matchMedia('(pointer: coarse)').matches;
 const MAX_DPR = IS_MOBILE ? 1.5 : 2;

 const renderer = new THREE.WebGLRenderer({ antialias: true });
 renderer.setPixelRatio(Math.min(devicePixelRatio, MAX_DPR));
 renderer.setSize(innerWidth, innerHeight);
 renderer.toneMapping = THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure = 1.2;
 document.body.appendChild(renderer.domElement);
 renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());

 const scene = new THREE.Scene();
 scene.background = new THREE.Color('#0b0803');

 const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);

 const controls = new OrbitControls(camera, renderer.domElement);
 controls.enableDamping = true;
 controls.dampingFactor = 0.06;
 controls.minDistance = 4;
 controls.maxDistance = 70;

 const introFrom = new THREE.Vector3(38, 26, 44);
 const introTo = new THREE.Vector3(6, 9, camera.aspect < 1 ? 21 : 15);
 let introT = 0;
 camera.position.copy(introFrom);
 controls.enabled = false;
 controls.autoRotateSpeed = 0.3;
 let clock = new THREE.Clock();
 let lastInteract = 0;
 controls.addEventListener('start', () => { lastInteract = clock.elapsedTime; });

 function finishIntro() {
 introT = 1;
 camera.position.copy(introTo);
 controls.enabled = true;
 lastInteract = clock.elapsedTime;
 }

 setTimeout(() => document.getElementById('fade').classList.add('done'), 100);

 const composer = new EffectComposer(renderer);
 composer.setPixelRatio(Math.min(devicePixelRatio, MAX_DPR));
 composer.setSize(innerWidth, innerHeight);
 composer.addPass(new RenderPass(scene, camera));
 const bloomStrength = IS_MOBILE ? 0.45 : 0.65;
 composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), bloomStrength, 0.6, 0.3));

 const afterimagePass = new AfterimagePass(0.88);
 afterimagePass.enabled = new URLSearchParams(location.search).has('trails');
 composer.addPass(afterimagePass);

 composer.addPass(new OutputPass());

 const cinematicPass = new ShaderPass({
 uniforms: {
 tDiffuse: { value: null },
 uTime: { value: 0 },
 },
 vertexShader: /* glsl */ `
 varying vec2 vUv;
 void main() {
 vUv = uv;
 gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
 }
 `,
 fragmentShader: /* glsl */ `
 uniform sampler2D tDiffuse;
 uniform float uTime;
 varying vec2 vUv;

 float rand(vec2 co) {
 return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
 }

 void main() {
 vec2 centered = vUv - 0.5;
 float dist = length(centered);

 vec2 shift = centered * dist * 0.008;
 vec3 col;
 col.r = texture2D(tDiffuse, vUv + shift).r;
 col.g = texture2D(tDiffuse, vUv).g;
 col.b = texture2D(tDiffuse, vUv - shift).b;

 col *= vec3(1.005, 1.0, 0.99);
 col += vec3(0.003, 0.002, 0.001) * (1.0 - col);

 float luma = dot(col, vec3(0.299, 0.587, 0.114));
 float tt = mod(uTime, 10.0);
 float grain = rand(gl_FragCoord.xy + vec2(tt * 127.1, tt * 311.7)) - 0.5;
 col += grain * 0.055 * (1.0 - smoothstep(0.0, 0.5, luma));

 float vig = smoothstep(0.92, 0.30, dist);
 col *= mix(0.62, 1.0, vig);

 gl_FragColor = vec4(col, 1.0);
 }
 `,
 });
 composer.addPass(cinematicPass);

 const galaxy = new THREE.Group();
 scene.add(galaxy);

 function drawPetal(ctx, x, y, angle, len, width, stops = ['#ffef9e', '#ffd23e', '#ffb400']) {
 ctx.save();
 ctx.translate(x, y);
 ctx.rotate(angle);
 const gradient = ctx.createLinearGradient(0, 0, 0, -len);
 gradient.addColorStop(0.0, stops[0]);
 gradient.addColorStop(0.55, stops[1]);
 gradient.addColorStop(1.0, stops[2]);
 ctx.beginPath();
 ctx.moveTo(0, 0);
 ctx.bezierCurveTo(width, -len * 0.25, width * 0.95, -len * 0.8, 0, -len);
 ctx.bezierCurveTo(-width * 0.95, -len * 0.8, -width, -len * 0.25, 0, 0);
 ctx.closePath();
 ctx.fillStyle = gradient;
 ctx.fill();
 ctx.lineWidth = 3;
 ctx.strokeStyle = 'rgba(200, 140, 15, 0.55)';
 ctx.stroke();
 ctx.restore();
 }

 function drawFlower(canvas) {
 const size = canvas.width;
 const cx = size / 2;
 const cy = size / 2;
 const ctx = canvas.getContext('2d');

 ctx.shadowColor = 'rgba(255, 220, 110, 0.9)';
 ctx.shadowBlur = 22;

 const petals = 13;
 for (let i = 0; i < petals; i++) {
 drawPetal(ctx, cx, cy, (i / petals) * Math.PI * 2, size * 0.42, size * 0.085);
 }

 const center = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.14);
 center.addColorStop(0.0, '#ffe083');
 center.addColorStop(0.6, '#eda419');
 center.addColorStop(1.0, '#a5670d');
 ctx.shadowBlur = 0;
 ctx.beginPath();
 ctx.arc(cx, cy, size * 0.14, 0, Math.PI * 2);
 ctx.fillStyle = center;
 ctx.fill();
 ctx.lineWidth = 5;
 ctx.strokeStyle = 'rgba(140, 88, 12, 0.9)';
 ctx.stroke();
 }

 function drawGlow(canvas) {
 const size = canvas.width;
 const ctx = canvas.getContext('2d');
 const g = ctx.createRadialGradient(size / 2, si
